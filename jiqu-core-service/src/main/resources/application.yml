server:
  port: 8085
spring:
  application:
    name: jiqu
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.17.130}:${MYSQL_PORT:3306}/jiqu_community?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:192.168.17.130}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
  ai:
    # OpenAI 兼容模式（DashScope 百炼）
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          # qwen3.7-plus 免费额度已耗尽（403），qwen-plus 额度正常且支持 Function Calling
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v4
          encoding-format: float
          dimensions: 1024
    # 默认重试 10 次、间隔指数增长，模型报错时会卡几分钟；压到 3 次快速失败
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        max-interval: 10s
        multiplier: 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1    
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    generator:
      WRITE_NUMBERS_AS_STRINGS: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:192.168.17.130:9092}
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      #默认的消费组ID
      group-id: create_drop_order
      #是否自动提交offset
      enable-auto-commit: false
      # 当kafka中没有初始offset或offset超出范围时将自动重置offset
      # earliest:重置为分区中最小的offset;
      # latest:重置为分区中最新的offset(消费分区中新产生的数据);
      # none:只要有一个分区不存在已提交的offset,就抛出异常;
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
mybatis-plus:
  type-aliases-package: com.jiqu.community.entity # 别名扫描包
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
logging:
  level:
    com.jiqu.community: info
    AUDIT: INFO
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.http.client: DEBUG
  pattern:
    dateformat: mm:ss.SSS
bloom-filter:
  filters:
    store:
      name: store-id-bloom
      expected-insertions: 50000
      false-probability: 0.01
    drop:
      name: drop-id-bloom
      expected-insertions: 100000
      false-probability: 0.01
management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  prometheus:
    metrics:
      export:
        enabled: true
#rate-limit:
#  ip-whitelist:
#    - 127.0.0.1
rate-limit:
  enable-sliding-window: true
  user-window-millis: 60000
  user-max-attempts: 10        # 60 秒窗口内单用户最多 10 次
  ip-window-millis: 60000
  ip-max-attempts: 10000       # IP 阈值放大到 10000，1000 个请求根本够不到 → 只测 user 维度

ai:
  rag:
    enabled: true